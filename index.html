<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية خاصة</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tahoma', sans-serif;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #d63384;
            margin-bottom: 20px;
            font-size: 24px;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }
        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }
        #yesBtn:hover {
            background-color: #e43f5e;
        }
        #noBtn {
            background-color: #ccc;
            color: #333;
            position: absolute;
        }
        .hidden-message {
            display: none;
            margin-top: 20px;
            color: #2b9348;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>إلى الشخص الأغلى ❤️</h1>
        <p>هل تقبلين أن تكوني جزءاً أجمل من كل أيامي القادمة؟</p>
        
        <div class="buttons">
            <button id="yesBtn" onclick="showLove()">نعم بالتأكيد ❤️</button>
            <button id="noBtn" onmouseover="moveButton()">لا</button>
        </div>

        <div id="loveMessage" class="hidden-message">
            تم تسجيل الإجابة بنجاح! أحبكِ جداً وعسى أن نبقى معاً دائماً 🥰✨
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 100);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function showLove() {
            document.getElementById('yesBtn').style.display = 'none';
            document.getElementById('noBtn').style.display = 'none';
            document.querySelector('p').style.display = 'none';
            document.getElementById('loveMessage').style.display = 'block';
        }
    </script>

</body>
</html>
